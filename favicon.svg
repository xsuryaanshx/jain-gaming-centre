<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141419" />
      <stop offset="50%" stop-color="#0a0a0d" />
      <stop offset="100%" stop-color="#000000" />
    </linearGradient>

    <!-- Subtle Border Stroke -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3f3f46" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#27272a" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#52525b" stop-opacity="0.6" />
    </linearGradient>

    <!-- Cyan Glow -->
    <radialGradient id="cyanGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.35" />
      <stop offset="50%" stop-color="#0891b2" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#0891b2" stop-opacity="0" />
    </radialGradient>

    <!-- Gamepad Gradient -->
    <linearGradient id="padGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#27272e" />
      <stop offset="100%" stop-color="#121216" />
    </linearGradient>

    <!-- Silver highlight -->
    <linearGradient id="silverGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#94a3b8" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Squircle -->
  <rect x="24" y="24" width="464" height="464" rx="108" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="8" />

  <!-- Ambient Center Glow -->
  <circle cx="256" cy="256" r="190" fill="url(#cyanGlow)" />

  <!-- Controller Shell Group -->
  <g transform="translate(0, 10)">
    <!-- Controller Body Outline / Shadow -->
    <path
      d="M140 180 C180 174, 332 174, 372 180 C406 185, 436 210, 442 250 C450 300, 426 400, 396 414 C366 428, 330 380, 308 340 C280 348, 232 348, 204 340 C182 380, 146 428, 116 414 C86 400, 62 300, 70 250 C76 210, 106 185, 140 180 Z"
      fill="url(#padGrad)"
      stroke="#3f3f46"
      stroke-width="5"
      stroke-linejoin="round"
    />

    <!-- Top Lightbar Accent (Cyan Neon) -->
    <path
      d="M180 184 C220 180, 292 180, 332 184"
      fill="none"
      stroke="#06b6d4"
      stroke-width="4"
      stroke-linecap="round"
      filter="url(#glow)"
    />

    <!-- Center Touchpad Display with JG Initials -->
    <rect
      x="196"
      y="200"
      width="120"
      height="80"
      rx="14"
      fill="#09090c"
      stroke="#27272a"
      stroke-width="3"
    />
    <!-- Subtle Touchpad inner cyan border top -->
    <line x1="210" y1="202" x2="302" y2="202" stroke="#06b6d4" stroke-width="2" opacity="0.8" />

    <!-- "JG" Text in Center -->
    <text
      x="256"
      y="256"
      font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif"
      font-size="44"
      font-weight="900"
      letter-spacing="2"
      fill="url(#silverGrad)"
      text-anchor="middle"
      dominant-baseline="central"
    >JG</text>

    <!-- D-Pad (Left side) -->
    <g transform="translate(138, 250)">
      <!-- Cross background -->
      <path
        d="M-8 -32 H8 V-8 H32 V8 H8 V32 H-8 V8 H-32 V-8 H-8 Z"
        fill="#18181b"
        stroke="#52525b"
        stroke-width="3"
        stroke-linejoin="round"
      />
      <!-- Center indent -->
      <circle cx="0" cy="0" r="4" fill="#09090b" />
    </g>

    <!-- Action Buttons (Right side - PlayStation / Gaming style 4 circles) -->
    <g transform="translate(374, 250)">
      <!-- North (Triangle / Green) -->
      <circle cx="0" cy="-24" r="8" fill="#10b981" />
      <!-- East (Circle / Red) -->
      <circle cx="24" cy="0" r="8" fill="#ef4444" />
      <!-- South (Cross / Blue) -->
      <circle cx="0" cy="24" r="8" fill="#3b82f6" />
      <!-- West (Square / Yellow) -->
      <circle cx="-24" cy="0" r="8" fill="#f59e0b" />
    </g>

    <!-- Twin Analog Thumbsticks -->
    <!-- Left Stick -->
    <g transform="translate(196, 322)">
      <circle cx="0" cy="0" r="28" fill="#09090d" stroke="#27272a" stroke-width="4" />
      <circle cx="0" cy="0" r="21" fill="#1e1e24" stroke="#06b6d4" stroke-width="2.5" />
      <circle cx="0" cy="0" r="7" fill="#09090d" />
    </g>

    <!-- Right Stick -->
    <g transform="translate(316, 322)">
      <circle cx="0" cy="0" r="28" fill="#09090d" stroke="#27272a" stroke-width="4" />
      <circle cx="0" cy="0" r="21" fill="#1e1e24" stroke="#06b6d4" stroke-width="2.5" />
      <circle cx="0" cy="0" r="7" fill="#09090d" />
    </g>
  </g>
</svg>
